<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quran Word by Word</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Stores the path in sessionStorage and redirects to index.html
      // which will then navigate to the correct route
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      sessionStorage.setItem('spa-redirect', path + search + hash);
      window.location.replace('/quran/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
